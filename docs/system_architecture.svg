<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">Souq Engine System Architecture</title>
  <desc id="desc">High level architecture diagram for a multi-tenant ecommerce platform with Django REST backend, Next.js frontend, PostgreSQL database, cache, media storage, and AI provider.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 38px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #5a6475; }
      .band-title { font: 700 19px Arial, sans-serif; fill: #172033; }
      .box-title { font: 700 20px Arial, sans-serif; fill: #172033; }
      .box-text { font: 400 15px Arial, sans-serif; fill: #4d596b; }
      .small { font: 400 13px Arial, sans-serif; fill: #5a6475; }
      .label { font: 700 14px Arial, sans-serif; fill: #334155; }
      .box { stroke-width: 2; rx: 8; ry: 8; }
      .external { fill: #ffffff; stroke: #475569; }
      .frontend { fill: #e7f5f1; stroke: #1f8a70; }
      .api { fill: #e9f0ff; stroke: #3b63c7; }
      .domain { fill: #fff8e8; stroke: #c98712; }
      .ai { fill: #f3eafa; stroke: #8b5bb7; }
      .data { fill: #eef7ff; stroke: #3980b9; }
      .media { fill: #f5f7f9; stroke: #64748b; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.4; marker-end: url(#arrow); }
      .arrow-strong { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow-strong); }
      .flow { fill: none; stroke: #8b5bb7; stroke-width: 2.3; marker-end: url(#arrow-ai); }
      .divider { stroke: #d5dbe5; stroke-width: 1.5; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-strong" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5bb7"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="950"/>

  <text class="title" x="70" y="65">Souq Engine - System Architecture</text>
  <text class="subtitle" x="70" y="98">Multi-tenant e-commerce platform with AI-powered store draft generation</text>

  <rect x="60" y="135" width="1480" height="625" rx="18" fill="#ffffff" stroke="#d9dee8" stroke-width="2"/>
  <line class="divider" x1="60" y1="250" x2="1540" y2="250"/>
  <line class="divider" x1="60" y1="380" x2="1540" y2="380"/>
  <line class="divider" x1="60" y1="615" x2="1540" y2="615"/>

  <text class="band-title" x="86" y="168">Experience Layer</text>
  <text class="band-title" x="86" y="283">API Layer</text>
  <text class="band-title" x="86" y="413">Domain and Business Layer</text>
  <text class="band-title" x="86" y="648">Data and External Services</text>

  <rect class="box external" x="245" y="165" width="250" height="58"/>
  <text class="box-title" x="370" y="189" text-anchor="middle">Users</text>
  <text class="box-text" x="370" y="211" text-anchor="middle">Store Owner / Customer / Admin</text>

  <rect class="box frontend" x="630" y="155" width="310" height="78"/>
  <text class="box-title" x="785" y="184" text-anchor="middle">Next.js Frontend</text>
  <text class="box-text" x="785" y="207" text-anchor="middle">React + TypeScript + Tailwind</text>
  <text class="small" x="785" y="226" text-anchor="middle">Dashboard, storefront, admin, AI generator</text>

  <rect class="box api" x="620" y="285" width="330" height="72"/>
  <text class="box-title" x="785" y="313" text-anchor="middle">Django REST API</text>
  <text class="box-text" x="785" y="336" text-anchor="middle">DRF + SimpleJWT + tenant middleware</text>

  <rect class="box media" x="1045" y="285" width="245" height="72"/>
  <text class="box-title" x="1167.5" y="313" text-anchor="middle">API Docs</text>
  <text class="box-text" x="1167.5" y="336" text-anchor="middle">Swagger / ReDoc / OpenAPI</text>

  <path class="arrow-strong" d="M 495 194 L 620 194"/>
  <path class="arrow-strong" d="M 785 233 L 785 285"/>
  <path class="arrow" d="M 950 321 L 1045 321"/>
  <text class="label" x="548" y="181" text-anchor="middle">HTTPS</text>
  <text class="label" x="824" y="263" text-anchor="start">REST JSON</text>

  <rect class="box domain" x="170" y="435" width="195" height="78"/>
  <text class="box-title" x="267.5" y="464" text-anchor="middle">users</text>
  <text class="box-text" x="267.5" y="487" text-anchor="middle">Auth, roles</text>
  <text class="small" x="267.5" y="506" text-anchor="middle">tenant context</text>

  <rect class="box domain" x="395" y="435" width="195" height="78"/>
  <text class="box-title" x="492.5" y="464" text-anchor="middle">stores</text>
  <text class="box-text" x="492.5" y="487" text-anchor="middle">CRUD, settings</text>
  <text class="small" x="492.5" y="506" text-anchor="middle">domains, publish flow</text>

  <rect class="box domain" x="620" y="435" width="195" height="78"/>
  <text class="box-title" x="717.5" y="464" text-anchor="middle">catalog</text>
  <text class="box-text" x="717.5" y="487" text-anchor="middle">categories + products</text>
  <text class="small" x="717.5" y="506" text-anchor="middle">images, inventory</text>

  <rect class="box domain" x="845" y="435" width="195" height="78"/>
  <text class="box-title" x="942.5" y="464" text-anchor="middle">orders</text>
  <text class="box-text" x="942.5" y="487" text-anchor="middle">Cart, checkout</text>
  <text class="small" x="942.5" y="506" text-anchor="middle">customers, order items</text>

  <rect class="box domain" x="1070" y="435" width="195" height="78"/>
  <text class="box-title" x="1167.5" y="464" text-anchor="middle">themes + SEO</text>
  <text class="box-text" x="1167.5" y="487" text-anchor="middle">Appearance templates</text>
  <text class="small" x="1167.5" y="506" text-anchor="middle">metadata and public pages</text>

  <rect class="box ai" x="1295" y="435" width="205" height="78"/>
  <text class="box-title" x="1397.5" y="464" text-anchor="middle">AI Store Creation</text>
  <text class="box-text" x="1397.5" y="487" text-anchor="middle">Draft, clarify, regenerate</text>
  <text class="small" x="1397.5" y="506" text-anchor="middle">apply approved data</text>

  <rect class="box api" x="545" y="545" width="480" height="48"/>
  <text class="box-title" x="785" y="575" text-anchor="middle">Service / Selector / Serializer Layer</text>
  <text class="small" x="785" y="591" text-anchor="middle">Business rules, validation, permissions, tenant scoping</text>

  <path class="arrow" d="M 785 357 C 785 398 267 398 267 435"/>
  <path class="arrow" d="M 785 357 C 785 398 492 398 492 435"/>
  <path class="arrow" d="M 785 357 L 718 435"/>
  <path class="arrow" d="M 785 357 L 943 435"/>
  <path class="arrow" d="M 785 357 C 785 398 1168 398 1168 435"/>
  <path class="arrow" d="M 785 357 C 785 398 1398 398 1398 435"/>

  <path class="arrow" d="M 268 513 C 268 545 545 545 585 545"/>
  <path class="arrow" d="M 493 513 L 610 545"/>
  <path class="arrow" d="M 718 513 L 718 545"/>
  <path class="arrow" d="M 943 513 L 900 545"/>
  <path class="arrow" d="M 1168 513 C 1168 545 1025 545 985 545"/>
  <path class="arrow" d="M 1398 513 C 1398 578 1040 578 1025 578"/>

  <rect class="box data" x="230" y="675" width="285" height="62"/>
  <text class="box-title" x="372.5" y="701" text-anchor="middle">PostgreSQL</text>
  <text class="box-text" x="372.5" y="724" text-anchor="middle">Persistent tenant business data</text>

  <rect class="box data" x="565" y="675" width="285" height="62"/>
  <text class="box-title" x="707.5" y="701" text-anchor="middle">Redis / LocMem Cache</text>
  <text class="box-text" x="707.5" y="724" text-anchor="middle">Temporary AI drafts and metadata</text>

  <rect class="box media" x="900" y="675" width="245" height="62"/>
  <text class="box-title" x="1022.5" y="701" text-anchor="middle">Media Storage</text>
  <text class="box-text" x="1022.5" y="724" text-anchor="middle">Uploaded product images</text>

  <rect class="box ai" x="1195" y="675" width="285" height="62"/>
  <text class="box-title" x="1337.5" y="701" text-anchor="middle">AI Provider</text>
  <text class="box-text" x="1337.5" y="724" text-anchor="middle">Ollama / OpenAI-compatible API</text>

  <path class="arrow" d="M 650 593 C 650 635 373 635 373 675"/>
  <path class="arrow" d="M 746 593 L 708 675"/>
  <path class="arrow" d="M 891 593 C 891 640 1023 640 1023 675"/>
  <path class="flow" d="M 1398 513 C 1480 570 1480 640 1338 675"/>
  <path class="flow" d="M 1195 706 C 1085 706 965 626 905 593"/>
  <text class="label" x="1444" y="608" text-anchor="middle">prompt / response</text>

  <rect x="60" y="795" width="1480" height="105" rx="18" fill="#ffffff" stroke="#d9dee8" stroke-width="2"/>
  <text class="band-title" x="86" y="828">AI Draft Workflow</text>
  <text class="small" x="86" y="855">View -> Service -> Provider -> Prompt -> AI -> Parser -> Validator -> Cache -> Apply to DB</text>

  <g transform="translate(330,818)">
    <rect class="box ai" x="0" y="35" width="140" height="42"/>
    <text class="box-text" x="70" y="61" text-anchor="middle">Description</text>
    <rect class="box ai" x="180" y="35" width="140" height="42"/>
    <text class="box-text" x="250" y="61" text-anchor="middle">Prompt</text>
    <rect class="box ai" x="360" y="35" width="140" height="42"/>
    <text class="box-text" x="430" y="61" text-anchor="middle">Provider</text>
    <rect class="box ai" x="540" y="35" width="140" height="42"/>
    <text class="box-text" x="610" y="61" text-anchor="middle">Parse + Validate</text>
    <rect class="box ai" x="720" y="35" width="140" height="42"/>
    <text class="box-text" x="790" y="61" text-anchor="middle">Draft Cache</text>
    <rect class="box ai" x="900" y="35" width="140" height="42"/>
    <text class="box-text" x="970" y="61" text-anchor="middle">Apply to DB</text>
    <path class="flow" d="M 140 56 L 180 56"/>
    <path class="flow" d="M 320 56 L 360 56"/>
    <path class="flow" d="M 500 56 L 540 56"/>
    <path class="flow" d="M 680 56 L 720 56"/>
    <path class="flow" d="M 860 56 L 900 56"/>
  </g>
</svg>
